tasks.register('verifyArmorOperationArbitration') {
	group = 'verification'
	description = 'Checks B/N/wardrobe/platform/core operations remain serialized and B prioritizes the physically worn suit.'
	def assemblyClient = file('src/client/java/dev/codex/flightarmor/client/assembly/ArmorAssemblyClient.java')
	def cruiseController = file('src/main/java/dev/codex/flightarmor/cruise/ArmorCruiseController.java')
	def coreController = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreController.java')
	def wardrobeController = file('src/main/java/dev/codex/flightarmor/wardrobe/ArmorWardrobeController.java')
	def platformBlock = file('src/main/java/dev/codex/flightarmor/platform/ChargingPlatformBlock.java')
	def combatGate = file('src/main/java/dev/codex/flightarmor/combat/ArmorCombatGate.java')
	def combatController = file('src/main/java/dev/codex/flightarmor/combat/ArmorCombatController.java')
	def creativeCoreScreen = file('src/client/java/dev/codex/flightarmor/mixin/CreativeInventoryScreenMixin.java')
	def coreSlot = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreSlot.java')
	def capturedClients = [
			file('src/client/java/dev/codex/flightarmor/client/core/ArmorCoreClient.java'),
			file('src/client/java/dev/codex/flightarmor/client/cruise/CruiseCombatClient.java'),
			file('src/client/java/dev/codex/flightarmor/client/combat/ArmorCombatClient.java'),
			file('src/client/java/dev/codex/flightarmor/client/FlightArmorClient.java')
	]
	inputs.files([assemblyClient, cruiseController, coreController, wardrobeController, platformBlock,
			combatGate, combatController,
			creativeCoreScreen, coreSlot] + capturedClients)
	doLast {
		def assembly = assemblyClient.getText('UTF-8')
		if (!assembly.contains('else if (quickSwitchClicked)')
				|| !assembly.contains('isOperationCapturedThisTick')) {
			throw new GradleException('B/N client arbitration is no longer mutually exclusive')
		}
		def flightClient = file('src/client/java/dev/codex/flightarmor/client/FlightArmorClient.java').getText('UTF-8')
		if (!flightClient.contains('FlightInputArbitration.resolve(')
				|| !flightClient.contains('keySprint.same(client.options.keyShift)')
				|| !flightClient.contains('isPlatformInteractionCaptured(client)')) {
			throw new GradleException('Flight input no longer arbitrates rebound sprint/sneak or Shift-use platform gestures')
		}
		def cruise = cruiseController.getText('UTF-8')
		def requestStart = cruise.indexOf('public static void handleRequest')
		def requestEnd = cruise.indexOf('public static boolean recallPlatformSuit', requestStart)
		def request = cruise.substring(requestStart, requestEnd)
		def wornSuitRoute = request.indexOf('if (ModItems.hasFullSet(player))')
		def partialSuitRoute = request.indexOf('if (!allArmorSlotsEmpty(player))')
		def configuredPlan = request.indexOf('executeConfiguredRecallPlanForB')
		def independentFallback = request.indexOf('CruiseState state')
		if (wornSuitRoute < 0 || partialSuitRoute < 0 || configuredPlan < 0 || independentFallback < 0
				|| wornSuitRoute > partialSuitRoute || partialSuitRoute > configuredPlan
				|| configuredPlan > independentFallback
				|| !request.substring(partialSuitRoute, configuredPlan).contains('ArmorAssemblyController.handleRequest(player)')
				|| !request.contains('deployWornSuit(player, ownership.suitId())')) {
			throw new GradleException('B must route exact full/partial physical armor before core planning and owner-carrier fallback')
		}
		def core = coreController.getText('UTF-8')
		if (!core.contains('isMovementAction(payload.action())')
				|| core.contains('binding == null || ArmorCruiseController.hasActiveCruise(player)')) {
			throw new GradleException('Core transaction lock or exact-suit platform switch routing regressed')
		}
		def creativeCore = creativeCoreScreen.getText('UTF-8')
		if (!creativeCore.contains('flightArmor$unwrapCoreSlot(slot)')
				|| !creativeCore.contains('clickType != ClickType.PICKUP')
				|| !creativeCore.contains('flightArmor$coreBeforeClick, carriedAfter')
				|| !creativeCore.contains('ci.cancel()')) {
			throw new GradleException('Creative inventory core clicks are no longer isolated from backpack clicks')
		}
		if (!coreSlot.getText('UTF-8').contains('container.canPlaceItem(getContainerSlot(), stack)')) {
			throw new GradleException('Core slot ownership validation no longer happens before item transfer')
		}
		if (!wardrobeController.getText('UTF-8').contains('hasActiveQuickSwitch(player)')
				|| wardrobeController.getText('UTF-8').contains('hasActiveCruise(player)')
				|| platformBlock.getText('UTF-8').contains('hasActiveCruise(player)')
				|| combatGate.getText('UTF-8').contains('hasActiveCruise(player)')
				|| combatController.getText('UTF-8').contains('hasActiveCruise(player)')) {
			throw new GradleException('Exact transactions must remain guarded without globally locking unrelated cruise suits')
		}
		capturedClients.each { source ->
			if (!source.getText('UTF-8').contains('isOperationCapturedThisTick')) {
				throw new GradleException('Same-tick operation capture is missing from a client input controller')
			}
		}
	}
}

tasks.register('verifyArmorCoreSlotTransactions') {
	group = 'verification'
	description = 'Guards lossless core-slot pickup, atomic creative cursor synchronization and block interaction pass-through.'
	def creativeCoreScreen = file('src/client/java/dev/codex/flightarmor/mixin/CreativeInventoryScreenMixin.java')
	def coreController = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreController.java')
	def coreInventory = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreInventory.java')
	def creativePayload = file('src/main/java/dev/codex/flightarmor/network/ArmorCoreCreativeSyncPayload.java')
	def coreItem = file('src/main/java/dev/codex/flightarmor/item/ArmorNavigationCoreItem.java')
	inputs.files(creativeCoreScreen, coreController, coreInventory, creativePayload, coreItem)
	doLast {
		def creative = creativeCoreScreen.getText('UTF-8')
		if (!creative.contains('flightArmor$coreBeforeClick, carriedAfter')
				|| !creative.contains('ItemStack.matches(flightArmor$coreBeforeClick, after)')
				|| !creative.contains('client.player.inventoryMenu.getCarried()')
				|| !creative.contains('clickType != ClickType.PICKUP')
				|| !creative.contains('ci.cancel()')
				|| creative.contains('flightArmor$handleCreativeCorePickup')) {
			throw new GradleException('Creative core slot must retain vanilla cursor movement and send one atomic slot/cursor request')
		}
		def payload = creativePayload.getText('UTF-8')
		if (!payload.contains('ItemStack core, ItemStack expectedCore, ItemStack carriedAfter')
				|| payload.contains('returnedCore')) {
			throw new GradleException('Creative core payload must carry desired slot, expected slot and resulting cursor')
		}
		def controller = coreController.getText('UTF-8')
		def handlerStart = controller.indexOf('public static void handleCreativeCoreSync')
		def handlerEnd = controller.indexOf('private static boolean isValidCreativeCoreStack', handlerStart)
		def handler = controller.substring(handlerStart, handlerEnd)
		if (!handler.contains('ItemStack.matches(current, expected)')
				|| !handler.contains('player.inventoryMenu.setCarried(carriedAfter')
				|| !handler.contains('player.inventoryMenu.sendAllDataToRemote()')
				|| handler.contains('player.getInventory().add(')
				|| handler.contains('player.drop(')) {
			throw new GradleException('Creative core synchronization lost atomic cursor/CAS validation or reintroduced duplication')
		}
		def inventory = coreInventory.getText('UTF-8')
		if (!inventory.contains('stored.copyWithCount(1)')
				|| !inventory.contains('return current.copyWithCount(1);')) {
			throw new GradleException('SavedData-backed core stacks must never be exposed or returned by mutable reference')
		}
		def item = coreItem.getText('UTF-8')
		if (!item.contains('return InteractionResult.PASS;')
				|| item.contains('InteractionResult.PASS_TO_DEFAULT_BLOCK_INTERACTION')) {
			throw new GradleException('Navigation core must pass ordinary block interaction using the Minecraft 1.21.1 API')
		}
	}
}

tasks.register('verifyArmorCoreInteractionContracts') {
	group = 'verification'
	description = 'Guards core membership, lossless slot removal, platform binding gestures and server-authoritative B/K interactions.'
	def coreController = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreController.java')
	def coreSavedData = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreSavedData.java')
	def coreInventory = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreInventory.java')
	def coreSlot = file('src/main/java/dev/codex/flightarmor/core/ArmorCoreSlot.java')
	def inventoryMenuMixin = file('src/main/java/dev/codex/flightarmor/mixin/InventoryMenuMixin.java')
	def coreItem = file('src/main/java/dev/codex/flightarmor/item/ArmorNavigationCoreItem.java')
	def platformBlock = file('src/main/java/dev/codex/flightarmor/platform/ChargingPlatformBlock.java')
	def assemblyClient = file('src/client/java/dev/codex/flightarmor/client/assembly/ArmorAssemblyClient.java')
	def coreClient = file('src/client/java/dev/codex/flightarmor/client/core/ArmorCoreClient.java')
	def coreScreen = file('src/client/java/dev/codex/flightarmor/client/core/ArmorCoreCommandScreen.java')
	inputs.files(coreController, coreSavedData, coreInventory, coreSlot, inventoryMenuMixin,
			coreItem, platformBlock, assemblyClient, coreClient, coreScreen)
	doLast {
		def section = { String source, String start, String end ->
			int from = source.indexOf(start)
			int to = from < 0 ? -1 : source.indexOf(end, from + start.length())
			if (from < 0 || to < 0) {
				throw new GradleException("Core interaction contract marker missing: ${start} -> ${end}")
			}
			source.substring(from, to)
		}

		def inventory = coreInventory.getText('UTF-8')
		def removal = section(inventory, 'public ItemStack removeItem(int slot, int amount)',
				'public ItemStack removeItemNoUpdate')
		if (!inventory.contains('stored.copyWithCount(1)')
				|| !removal.contains('data().setCore(owner.getUUID(), ItemStack.EMPTY)')
				|| !removal.contains('return current.copyWithCount(1);')
				|| removal.contains('return ItemStack.EMPTY;\\n\\t}')) {
			throw new GradleException('Core-slot pickup no longer clears and returns one authoritative copied core atomically')
		}
		def slot = coreSlot.getText('UTF-8')
		if (!slot.contains('!ArmorCoreController.isCoreChangeLocked(serverPlayer)')
				|| !slot.contains('container.stillValid(player)')
				|| !slot.contains('container.canPlaceItem(getContainerSlot(), stack)')) {
			throw new GradleException('Core slot bypasses transaction lock, ownership or container validation')
		}
		def menu = inventoryMenuMixin.getText('UTF-8')
		if (!menu.contains('if (fromCoreSlot && !coreSlot.mayPickup(player))')
				|| !menu.contains('source.setByPlayer(ItemStack.EMPTY, original)')
				|| !menu.contains('if (!moved)')) {
			throw new GradleException('Shift-click core transfer can bypass pickup lock or erase the source on a failed move')
		}

		def platform = platformBlock.getText('UTF-8')
		int heldCoreBranch = platform.indexOf('stack.is(ModItems.ARMOR_NAVIGATION_CORE)')
		int shiftBranch = platform.indexOf('player.isShiftKeyDown()', heldCoreBranch)
		if (heldCoreBranch < 0 || shiftBranch < 0 || heldCoreBranch > shiftBranch
				|| !platform.substring(heldCoreBranch, shiftBranch)
						.contains('ArmorCoreController.bindHeldCoreToPlatform')) {
			throw new GradleException('Held-core platform binding must win over Shift deposit/display interaction')
		}
		def item = coreItem.getText('UTF-8')
		def useOn = section(item, 'public InteractionResult useOn(UseOnContext context)',
				'public boolean isFoil')
		if (!useOn.contains('return InteractionResult.PASS;')
				|| useOn.contains('activateAndOpen') || useOn.contains('setCore(')
				|| useOn.contains('.shrink(')) {
			throw new GradleException('Right-clicking an ordinary block may activate, replace or consume a navigation core')
		}

		def client = coreClient.getText('UTF-8')
		def assembly = assemblyClient.getText('UTF-8')
		def screen = coreScreen.getText('UTF-8')
		def controller = coreController.getText('UTF-8')
		if (!client.contains('ClientPlayNetworking.send(new ArmorCoreOpenPayload())')
				|| !screen.contains('ArmorCoreAction.BIND_LOOKED_AT')
				|| !controller.contains('case BIND_LOOKED_AT -> bindLookedAt(player)')) {
			throw new GradleException('K panel/crosshair bind no longer routes through one server-authoritative action')
		}
		def openTick = section(client, 'public static void tick(Minecraft client)',
				'public static ArmorCoreSnapshotPayload snapshot()')
		int captureOpenTick = openTick.indexOf('ArmorAssemblyClient.captureOperationThisTick(client)')
		int sendOpenTick = openTick.indexOf('ClientPlayNetworking.send(new ArmorCoreOpenPayload())')
		if (!assembly.contains('public static void captureOperationThisTick(Minecraft client)')
				|| !assembly.contains('capturedOperationTick = client.player.tickCount')
				|| captureOpenTick < 0 || sendOpenTick < 0 || captureOpenTick > sendOpenTick) {
			throw new GradleException('K must publish same-tick operation capture immediately before sending its open request')
		}
		def lookedAt = section(controller, 'private static String bindLookedAt(ServerPlayer player)',
				'private static String primaryRoleChangeBlockReason')
		if (!lookedAt.contains('activeIdentity(player, record)')
				|| !lookedAt.contains('player.pick(6.0D')
				|| !lookedAt.contains('instanceof ChargingPlatformBlockEntity')
				|| !lookedAt.contains('bindPlatformIfCoreEquipped(player, platform)')) {
			throw new GradleException('Crosshair binding lost active-core, range or authoritative platform validation')
		}

		def bPlan = section(controller, 'public static BKeyPlanResult executeConfiguredRecallPlanForB',
				'public enum BKeyPlanResult')
		if (bPlan.contains('ModItems.hasFullSet(player)')
				|| bPlan.contains('DEPLOY_WORN_PRIMARY')
				|| !bPlan.contains('ArmorFormationPlanner.plan(snapshot)')) {
			throw new GradleException('B core planner must remain empty-slot formation only; exact worn routing belongs to the cruise entrypoint')
		}
		def snapshot = section(controller, 'private static void sendSnapshot(ServerPlayer player, String resultMessage)',
				'private static boolean reconcileWornSuitAssociation')
		if (snapshot.contains('reconcileWornSuitAssociation(player)')) {
			throw new GradleException('Core snapshot must be a read-only query and cannot migrate worn-suit membership')
		}
		def association = section(controller, 'private static boolean reconcileWornSuitAssociation(ServerPlayer player)',
				'private static ArmorCoreSnapshotPayload.Status legacyCoreStatus')
		if (!association.contains('ensureOwnedEquippedSet(player)')
				|| !association.contains('data.associateUnlinkedSuit(player.getUUID(), active, ownership.suitId())')) {
			throw new GradleException('Equipment discovery must link only suits absent from every core network')
		}

		def saved = coreSavedData.getText('UTF-8')
		def setPrimary = section(saved, 'boolean setPrimary(UUID ownerId',
				'Optional<PlatformBinding> binding')
		if (!setPrimary.contains('record.linkedSuitIds.contains(suitId)')
				|| setPrimary.contains('record.bindings.containsKey(suitId)')) {
			throw new GradleException('Canonical core membership must use linkedSuitIds, not optional platform homes')
		}
		def formation = section(controller, 'private static FormationExecution reconcileConfiguredFormation',
				'private static FormationExecution executeFormationCommands')
		if (!formation.contains('record.linkedSuitIds.contains(selectedPrimary)')
				|| formation.contains('record.bindings.containsKey(selectedPrimary)')) {
			throw new GradleException('Selected worn/online suit is still rejected when it lacks an optional platform home')
		}
		def execution = section(controller, 'private static FormationExecution executeFormationCommands',
				'private static String formationWaitMessage')
		int firstSwitch = execution.indexOf('switch (command.type())')
		int globalBindingReject = execution.indexOf('if (binding == null)')
		if (firstSwitch < 0 || (globalBindingReject >= 0 && globalBindingReject < firstSwitch)) {
			throw new GradleException('Online carrier recall is globally blocked by a missing optional platform binding')
		}
	}
}

