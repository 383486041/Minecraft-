plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = 'KosmX'
		url = 'https://maven.kosmx.dev/'
	}
	maven {
		name = 'RedlanceMinecraft'
		url = 'https://repo.redlance.org/public'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"flight_armor" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_animator_version}"
	modRuntimeOnly "io.github.kosmx.bendy-lib:bendy-lib-fabric:${project.bendy_lib_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

tasks.register('verifyArmorJointBounds') {
	def objFiles = files(
			'src/main/resources/assets/flight_armor/models/armor/flight_armor_vanguard.obj',
			'src/main/resources/assets/flight_armor/models/armor/flight_armor_swift.obj',
			'src/main/resources/assets/flight_armor/models/armor/flight_armor_sentinel.obj')
	inputs.files(objFiles)
	doLast {
		objFiles.files.each { objFile ->
		def bounds = [:].withDefault { [min: Double.POSITIVE_INFINITY, max: Double.NEGATIVE_INFINITY] }
		def xBounds = [:].withDefault { [min: Double.POSITIVE_INFINITY, max: Double.NEGATIVE_INFINITY] }
		def zBounds = [:].withDefault { [min: Double.POSITIVE_INFINITY, max: Double.NEGATIVE_INFINITY] }
		def group = null
		objFile.eachLine('UTF-8') { line ->
			if (line.startsWith('g ')) {
				group = line.substring(2).trim()
			} else if (group != null && line.startsWith('v ')) {
				def parts = line.trim().split(/\s+/)
				def x = parts[1] as double
				def y = parts[2] as double
				def z = parts[3] as double
				xBounds[group].min = Math.min(xBounds[group].min, x)
				xBounds[group].max = Math.max(xBounds[group].max, x)
				bounds[group].min = Math.min(bounds[group].min, y)
				bounds[group].max = Math.max(bounds[group].max, y)
				zBounds[group].min = Math.min(zBounds[group].min, z)
				zBounds[group].max = Math.max(zBounds[group].max, z)
			}
		}
		bounds.each { name, range ->
			if (name ==~ /arm_(left|right)_upper_.*/ && range.max > 6.001D) {
				throw new GradleException("上臂甲越过肘轴 Y=6: ${name}, max=${range.max}")
			}
			if (name ==~ /arm_(left|right)_forearm_.*/ && range.min < 5.999D) {
				throw new GradleException("前臂甲越过肘轴 Y=6: ${name}, min=${range.min}")
			}
		}
		// 用 Map 承载边界，避免 Groovy 在 Java 21 下为连续多个 double 闭包参数生成错误的局部变量表。
		def requireUnderlayerCoverage = { name, expected ->
			def groupName = name.toString()
			if (!bounds.containsKey(groupName)) {
				throw new GradleException("缺少立体软甲内衬: ${groupName}")
			}
			def xRange = xBounds[groupName]
			def zRange = zBounds[groupName]
			if (xRange.min > expected.minX || xRange.max < expected.maxX
					|| zRange.min > expected.minZ || zRange.max < expected.maxZ) {
				throw new GradleException("软甲内衬未完整覆盖玩家皮肤第二层: ${groupName}, " +
						"X=[${xRange.min},${xRange.max}], Z=[${zRange.min},${zRange.max}]")
			}
		}
		requireUnderlayerCoverage('body_underlayer_shadow', [minX: -4.33D, maxX: 4.33D, minZ: -2.35D, maxZ: 2.35D])
		requireUnderlayerCoverage('arm_left_upper_underlayer_shadow', [minX: -1.35D, maxX: 3.35D, minZ: -2.35D, maxZ: 2.35D])
		requireUnderlayerCoverage('arm_left_forearm_underlayer_shadow', [minX: -1.35D, maxX: 3.35D, minZ: -2.35D, maxZ: 2.35D])
		requireUnderlayerCoverage('arm_right_upper_underlayer_shadow', [minX: -3.35D, maxX: 1.35D, minZ: -2.35D, maxZ: 2.35D])
		requireUnderlayerCoverage('arm_right_forearm_underlayer_shadow', [minX: -3.35D, maxX: 1.35D, minZ: -2.35D, maxZ: 2.35D])
		for (def side : ['left', 'right']) {
			requireUnderlayerCoverage("leg_${side}_thigh_underlayer_shadow".toString(), [minX: -2.35D, maxX: 2.35D, minZ: -2.35D, maxZ: 2.35D])
			requireUnderlayerCoverage("boot_${side}_underlayer_shadow".toString(), [minX: -2.35D, maxX: 2.35D, minZ: -2.35D, maxZ: 2.35D])
			for (def joint : ["arm_${side}_elbow_seal_shadow".toString(), "leg_${side}_knee_seal_shadow".toString()]) {
				if (!bounds.containsKey(joint) || bounds[joint].min > 5.75D || bounds[joint].max < 6.25D) {
					throw new GradleException("肘膝软连接未跨过关节轴 Y=6: ${joint}")
				}
			}
		}
		if (zBounds['head_shell_shadow'].max < 4.25D) {
			throw new GradleException("头盔后脑安全距离不足: maxZ=${zBounds['head_shell_shadow'].max}")
		}
		if (zBounds['head_shell_shadow'].max > 4.50D) {
			throw new GradleException("头盔后脑轮廓过厚: maxZ=${zBounds['head_shell_shadow'].max}")
		}
		if (zBounds['head_faceplate_gunmetal'].min > -4.50D) {
			throw new GradleException("头盔面甲前向覆盖不足: minZ=${zBounds['head_faceplate_gunmetal'].min}")
		}
		if (zBounds['head_faceplate_gunmetal'].max > -4.20D) {
			throw new GradleException("面甲内表退入玩家脸部: maxZ=${zBounds['head_faceplate_gunmetal'].max}")
		}
		if (zBounds['visor_lens_visor'].max > -4.40D) {
			throw new GradleException("面罩边缘退入玩家脸部: maxZ=${zBounds['visor_lens_visor'].max}")
		}
		for (def name : ['head_rear_left_gunmetal', 'head_rear_right_gunmetal']) {
			if (zBounds[name].min < 4.35D) {
				throw new GradleException("后脑板覆盖不足: ${name}, minZ=${zBounds[name].min}")
			}
		}
		}
	}
}

tasks.register('verifyHitscanDamageTags') {
	def damageTypeTags = fileTree('src/main/resources/data') {
		include '**/tags/damage_type/is_projectile.json'
	}
	inputs.files(damageTypeTags)
	doLast {
		if (damageTypeTags.files.isEmpty()) {
			throw new GradleException('Missing minecraft:is_projectile damage tag')
		}
		def forbiddenHitscanDamageTypes = [
			'flight_armor:gravity_pulse',
			'flight_armor:core_beam'
		]
		def projectileTagFound = false
		damageTypeTags.files.each { tagFile ->
			def contents = tagFile.getText('UTF-8')
			forbiddenHitscanDamageTypes.each { damageType ->
				if (contents.contains(damageType)) {
					throw new GradleException("Hitscan damage type must not be tagged as projectile: ${damageType} in ${tagFile}")
				}
			}
			if (contents.contains('flight_armor:armor_missile')) {
				projectileTagFound = true
			}
		}
		if (!projectileTagFound) {
			throw new GradleException('armor_missile must be tagged as minecraft:is_projectile')
		}
	}
}
