def remappedRuntimeJar = tasks.named('remapJar').flatMap { it.archiveFile }
tasks.register('verifyMixinJarContents') {
	group = 'verification'
	description = 'Parses packaged mixin configs and verifies every declared runtime class with exact case.'
	dependsOn tasks.named('remapJar')
	inputs.file(remappedRuntimeJar)
	doLast {
		def jarFile = remappedRuntimeJar.get().asFile
		if (!jarFile.isFile()) {
			throw new GradleException('Remapped runtime JAR does not exist: ' + jarFile)
		}
		def zip = new java.util.zip.ZipFile(jarFile)
		try {
			int verifiedMixinClasses = 0
			int verifiedEntrypoints = 0
			def entryNames = zip.entries().collect { it.name }
			def exactEntry = { String requested, String purpose ->
				def entry = zip.getEntry(requested)
				if (entry != null && !entry.directory) return entry
				def caseMatches = entryNames.findAll { it.equalsIgnoreCase(requested) }
				if (!caseMatches.isEmpty()) {
					throw new GradleException(purpose + ' has wrong path/class case: expected '
							+ requested + ', found ' + caseMatches)
				}
				throw new GradleException(purpose + ' is missing from ' + jarFile.name + ': ' + requested)
			}
			def parseJson = { String path, String purpose ->
				def entry = exactEntry(path, purpose)
				zip.getInputStream(entry).withCloseable { stream ->
					new groovy.json.JsonSlurper().parse(
							new InputStreamReader(stream, java.nio.charset.StandardCharsets.UTF_8))
				}
			}

			def metadata = parseJson('fabric.mod.json', 'Fabric metadata')
			def configuredMixins = metadata.mixins
			if (!(configuredMixins instanceof Collection) || configuredMixins.isEmpty()) {
				throw new GradleException('fabric.mod.json has no packaged mixin configuration')
			}
			def configNames = configuredMixins.collect { configured ->
				if (configured instanceof CharSequence) return configured.toString()
				if (configured instanceof Map && configured.config instanceof CharSequence) {
					return configured.config.toString()
				}
				throw new GradleException('Unsupported fabric.mod.json mixin entry: ' + configured)
			}
			if (configNames.size() != configNames.toSet().size()) {
				throw new GradleException('Duplicate packaged mixin configs: ' + configNames)
			}

			configNames.each { String configName ->
				def config = parseJson(configName, 'Mixin config')
				def packageName = config.package
				if (packageName != 'dev.codex.flightarmor.mixin') {
					throw new GradleException(configName + ' package must be exactly '
							+ 'dev.codex.flightarmor.mixin, found ' + packageName)
				}
				if (!(packageName ==~ /[a-z_][a-z0-9_]*(\.[a-z_][a-z0-9_]*)+/)) {
					throw new GradleException(configName + ' has invalid Java package syntax: ' + packageName)
				}
				def declaredPaths = []
				['mixins', 'client', 'server'].each { String section ->
					def declared = config.containsKey(section) ? config[section] : []
					if (!(declared instanceof Collection)) {
						throw new GradleException(configName + ' ' + section + ' must be an array')
					}
					declared.each { mixinNameValue ->
						if (!(mixinNameValue instanceof CharSequence)) {
							throw new GradleException(configName + ' ' + section
									+ ' contains a non-string class: ' + mixinNameValue)
						}
						def mixinName = mixinNameValue.toString()
						if (!(mixinName ==~ /[A-Za-z_$][A-Za-z0-9_$]*(\.[A-Za-z_$][A-Za-z0-9_$]*)*/)) {
							throw new GradleException(configName + ' ' + section
									+ ' has invalid mixin class name: ' + mixinName)
						}
						def classPath = packageName.replace('.', '/') + '/' +
								mixinName.replace('.', '/') + '.class'
						exactEntry(classPath, configName + ' ' + section + ' mixin ' + mixinName)
						declaredPaths.add(classPath)
						verifiedMixinClasses++
					}
				}
				if (declaredPaths.size() != declaredPaths.toSet().size()) {
					throw new GradleException(configName + ' declares duplicate mixin classes: ' + declaredPaths)
				}
			}

			def entrypoints = metadata.entrypoints
			if (!(entrypoints instanceof Map)) {
				throw new GradleException('fabric.mod.json entrypoints must be an object')
			}
			entrypoints.each { environment, configuredEntries ->
				if (!(configuredEntries instanceof Collection)) {
					throw new GradleException('fabric.mod.json entrypoints.' + environment + ' must be an array')
				}
				configuredEntries.each { configured ->
					def value = configured instanceof CharSequence ? configured.toString()
							: configured instanceof Map && configured.value instanceof CharSequence
									? configured.value.toString() : null
					if (value == null || value.isBlank()) {
						throw new GradleException('Invalid fabric entrypoint for ' + environment + ': ' + configured)
					}
					def className = value.contains('::') ? value.substring(0, value.indexOf('::')) : value
					def classPath = className.replace('.', '/') + '.class'
					exactEntry(classPath, 'Fabric ' + environment + ' entrypoint ' + className)
					verifiedEntrypoints++
				}
			}
			logger.lifecycle('Verified packaged runtime classes in ' + jarFile.name + ': '
					+ verifiedMixinClasses + ' mixins, ' + verifiedEntrypoints + ' Fabric entrypoints')
		}
		finally {
			zip.close()
		}
	}
}
tasks.register('verifyChargingPlatformResources') {
	group = 'verification'
	description = 'Validates the 1.21.1 charging-platform recipe schema and every referenced model texture.'
	def recipeFile = file('src/main/resources/data/flight_armor/recipe/charging_platform.json')
	def blockstateFile = file('src/main/resources/assets/flight_armor/blockstates/charging_platform.json')
	def itemModelFile = file('src/main/resources/assets/flight_armor/models/item/charging_platform.json')
	def blockModelDir = file('src/main/resources/assets/flight_armor/models/block')
	def relatedBlockModels = fileTree(blockModelDir) { include 'charging_platform*.json' }
	inputs.files(recipeFile, blockstateFile, itemModelFile, relatedBlockModels)
	doLast {
		def parser = new groovy.json.JsonSlurper()
		def recipe = parser.parse(recipeFile)
		if (recipe.type != 'minecraft:crafting_shaped' || !(recipe.key instanceof Map)) {
			throw new GradleException('charging_platform must be a shaped recipe with an object key map')
		}
		def expectedIngredients = [
				'I': 'minecraft:iron_ingot',
				'D': 'minecraft:diamond',
				'R': 'minecraft:redstone_block',
				'C': 'minecraft:copper_block',
				'Q': 'minecraft:smooth_quartz'
		]
		expectedIngredients.each { symbol, itemId ->
			def ingredient = recipe.key[symbol]
			if (!(ingredient instanceof Map)) {
				throw new GradleException("Minecraft 1.21.1 ingredient ${symbol} must be an object, not ${ingredient?.getClass()?.simpleName}")
			}
			def selectors = ['item', 'tag'].findAll { ingredient[it] != null }
			if (selectors.size() != 1 || ingredient.item != itemId) {
				throw new GradleException("Invalid charging-platform ingredient ${symbol}: expected {item: ${itemId}}")
			}
		}
		if (recipe.key.keySet() != expectedIngredients.keySet()) {
			throw new GradleException("Unexpected charging-platform recipe symbols: ${recipe.key.keySet()}")
		}
		if (recipe.result?.id != 'flight_armor:charging_platform'
				|| (recipe.result?.count as int) != 1) {
			throw new GradleException('Invalid charging-platform recipe result')
		}

		def referencedModels = new LinkedHashSet<File>()
		def blockstate = parser.parse(blockstateFile)
		blockstate.variants.each { state, definition ->
			def variants = definition instanceof List ? definition : [definition]
			variants.each { variant ->
				def modelId = variant.model?.toString()
				if (modelId == null || !modelId.startsWith('flight_armor:block/')) {
					throw new GradleException("Charging-platform state ${state} has an invalid model: ${modelId}")
				}
				referencedModels.add(new File(blockModelDir,
						modelId.substring('flight_armor:block/'.length()) + '.json'))
			}
		}
		def itemModel = parser.parse(itemModelFile)
		if (itemModel.parent?.toString()?.startsWith('flight_armor:block/')) {
			referencedModels.add(new File(blockModelDir,
					itemModel.parent.toString().substring('flight_armor:block/'.length()) + '.json'))
		} else {
			throw new GradleException('Charging-platform item must reference a flight_armor block model')
		}
		referencedModels.addAll(relatedBlockModels.files)

		def verifiedMinecraft1211Textures = [
				'minecraft:block/polished_deepslate',
				'minecraft:block/iron_block',
				'minecraft:block/quartz_block_top',
				'minecraft:block/sea_lantern'
		] as Set
		referencedModels.each { modelFile ->
			if (!modelFile.isFile()) {
				throw new GradleException("Missing charging-platform model: ${modelFile}")
			}
			def model = parser.parse(modelFile)
			def textures = model.textures instanceof Map ? model.textures : [:]
			textures.each { name, rawReference ->
				def reference = rawReference?.toString()
				if (reference == 'minecraft:block/smooth_quartz') {
					throw new GradleException("smooth_quartz is a block id, not a 1.21.1 atlas texture: ${modelFile}")
				}
				if (reference?.startsWith('minecraft:block/')
						&& !verifiedMinecraft1211Textures.contains(reference)) {
					throw new GradleException("Unverified Minecraft 1.21.1 texture ${reference} in ${modelFile}")
				}
				if (reference?.startsWith('flight_armor:')) {
					def localPath = reference.substring('flight_armor:'.length())
					def textureFile = file("src/main/resources/assets/flight_armor/textures/${localPath}.png")
					if (!textureFile.isFile()) throw new GradleException("Missing local texture ${reference}")
				}
			}
			(model.elements ?: []).eachWithIndex { element, elementIndex ->
				(element.faces ?: [:]).each { direction, face ->
					def reference = face.texture?.toString()
					if (reference?.startsWith('#')
							&& !textures.containsKey(reference.substring(1))) {
						throw new GradleException("Undefined texture ${reference} on ${direction} face of element ${elementIndex} in ${modelFile}")
					}
				}
			}
		}
	}
}

tasks.register('verifyChargingPlatformMechanicalTransition') {
	group = 'verification'
	description = 'Guards one-shot platform lock-arm transitions and forbids periodic idle animation.'
	def stateSource = file('src/client/java/dev/codex/flightarmor/client/platform/ChargingPlatformVisualState.java')
	def rendererSource = file('src/client/java/dev/codex/flightarmor/client/platform/ChargingPlatformRenderer.java')
	inputs.files(stateSource, rendererSource)
	doLast {
		def state = stateSource.getText('UTF-8')
		def renderer = rendererSource.getText('UTF-8')
		if (!state.contains('TRANSITION_TICKS = 18.0F')
				|| !state.contains('assembledScale') || !state.contains('partsScale')
				|| !state.contains('lockProgress')) {
			throw new GradleException('Charging platform must keep the 18-tick assembled/parts/lock transition.')
		}
		['Math.sin', 'Mth.sin', 'floorMod', 'tickCount %'].each { periodic ->
			if (state.contains(periodic)) {
				throw new GradleException("Charging platform idle state must not use periodic motion: ${periodic}")
			}
		}
		if (!renderer.contains('renderMechanicalLocks(sample.lockProgress()')
				|| !renderer.contains('sample.transitioning()')
				|| !renderer.contains('LOCK_DETAIL_DISTANCE_SQUARED')
				|| !renderer.contains('MechanicalLockRenderType.INSTANCE')
				|| !renderer.contains('STATIC_PREVIEW_TICK = 0')) {
			throw new GradleException('Charging platform one-shot lock geometry, transition LOD, or static preview is missing.')
		}
		if (renderer.contains('renderSingleBlock') || renderer.contains('Blocks.IRON_BLOCK')
				|| renderer.contains('Blocks.SEA_LANTERN')) {
			throw new GradleException('Charging platform lock arms must not render full block models every frame.')
		}
		if (renderer.contains('shouldRenderOffScreen')
				|| !renderer.contains('PLATFORM_VIEW_DISTANCE = 48')) {
			throw new GradleException('Charging platform preview must stay on vanilla section-frustum culling with a finite view distance.')
		}
	}
}

tasks.register('verifyClientVisualSettings') {
	group = 'verification'
	description = 'Guards the client-only JSON settings page and its live presentation consumers.'
	def settingsDir = file('src/client/java/dev/codex/flightarmor/client/settings')
	def settingsData = file("${settingsDir}/FlightArmorClientSettings.java")
	def settingsStore = file("${settingsDir}/FlightArmorClientSettingsStore.java")
	def settingsScreen = file("${settingsDir}/FlightArmorClientSettingsScreen.java")
	def clientEntry = file('src/client/java/dev/codex/flightarmor/client/FlightArmorClient.java')
	def coreScreen = file('src/client/java/dev/codex/flightarmor/client/core/ArmorCoreCommandScreen.java')
	def hud = file('src/client/java/dev/codex/flightarmor/client/hud/FlightSpeedHud.java')
	def trail = file('src/client/java/dev/codex/flightarmor/client/render/SwiftFlightTrailRenderer.java')
	def cruiseAtmosphere = file('src/client/java/dev/codex/flightarmor/client/cruise/CruiseRecallFxRenderer.java')
	def platformAtmosphere = file('src/client/java/dev/codex/flightarmor/client/platform/PlatformRecallFxRenderer.java')
	def lowAltitudeFeedback = file('src/client/java/dev/codex/flightarmor/client/environment/LowAltitudeFeedbackClient.java')
	def flightSound = file('src/client/java/dev/codex/flightarmor/client/audio/ArmorSoundController.java')
	def assemblySound = file('src/client/java/dev/codex/flightarmor/client/audio/ArmorAssemblySoundController.java')
	def weaponSound = file('src/client/java/dev/codex/flightarmor/client/combat/ArmorWeaponSoundController.java')
	def platformSound = file('src/client/java/dev/codex/flightarmor/client/platform/PlatformRecallClient.java')
	inputs.files(settingsData, settingsStore, settingsScreen, clientEntry, coreScreen,
			hud, trail, cruiseAtmosphere, platformAtmosphere, lowAltitudeFeedback,
			flightSound, assemblySound, weaponSound, platformSound)
	doLast {
		[settingsData, settingsStore, settingsScreen].each { source ->
			if (!source.isFile()) throw new GradleException("Missing client settings source: ${source}")
		}
		def data = settingsData.getText('UTF-8')
		['hudEnabled', 'trailEnabled', 'environmentFeedbackEnabled', 'masterVolume',
				'CURRENT_SCHEMA_VERSION'].each { field ->
			if (!data.contains(field)) throw new GradleException("Client settings are missing ${field}")
		}
		def store = settingsStore.getText('UTF-8')
		['FabricLoader.getInstance().getConfigDir()', 'flight_armor-client.json',
				'StandardCharsets.UTF_8', 'StandardCopyOption.ATOMIC_MOVE',
				'JsonParser.parseReader'].each { contract ->
			if (!store.contains(contract)) {
				throw new GradleException("Client settings persistence lost contract: ${contract}")
			}
		}
		def forbiddenAuthority = ['ClientPlayNetworking', 'ServerPlayNetworking',
				'ArmorCoreAction', 'ArmorEscortProfile', 'terrainDestruction', 'pvpEnabled']
		def settingsSources = fileTree(settingsDir) { include '*.java' }.files
		forbiddenAuthority.each { token ->
			if (settingsSources.any { it.getText('UTF-8').contains(token) }) {
				throw new GradleException("Client-only settings must not own server authority: ${token}")
			}
		}
		if (!clientEntry.getText('UTF-8').contains('FlightArmorClientSettingsStore.initialize()')) {
			throw new GradleException('Client settings store is not initialized by the client entrypoint')
		}
		if (!coreScreen.getText('UTF-8').contains('new FlightArmorClientSettingsScreen(this)')) {
			throw new GradleException('Armor-core panel no longer opens the client settings page')
		}
		if (!hud.getText('UTF-8').contains('.hudEnabled()')) {
			throw new GradleException('Flight HUD does not consume hudEnabled')
		}
		if (!trail.getText('UTF-8').contains('.trailEnabled()')) {
			throw new GradleException('Swift trail does not consume trailEnabled')
		}
		if (![cruiseAtmosphere, platformAtmosphere].every {
			it.getText('UTF-8').contains('.environmentFeedbackEnabled()')
		}) {
			throw new GradleException('Atmospheric recall feedback does not consume environmentFeedbackEnabled')
		}
		if (!lowAltitudeFeedback.getText('UTF-8').contains('.environmentFeedbackEnabled()')) {
			throw new GradleException('Low-altitude world feedback does not consume environmentFeedbackEnabled')
		}
		[flightSound, assemblySound, weaponSound, platformSound].each { source ->
			if (!source.getText('UTF-8').contains('FlightArmorClientSettingsStore.masterVolume()')) {
				throw new GradleException("Armor audio bypasses the client master volume: ${source.name}")
			}
		}
	}
}

tasks.register('verifyClientOperationGuide') {
	group = 'verification'
	description = 'Guards the five-page in-game operation guide and bilingual translated UI text.'
	def guideScreen = file('src/client/java/dev/codex/flightarmor/client/settings/FlightArmorGuideScreen.java')
	def settingsScreen = file('src/client/java/dev/codex/flightarmor/client/settings/FlightArmorClientSettingsScreen.java')
	def zhFile = file('src/main/resources/assets/flight_armor/lang/zh_cn.json')
	def enFile = file('src/main/resources/assets/flight_armor/lang/en_us.json')
	inputs.files(guideScreen, settingsScreen, zhFile, enFile)
	doLast {
		[guideScreen, settingsScreen, zhFile, enFile].each { source ->
			if (!source.isFile()) throw new GradleException("Missing operation-guide resource: ${source}")
		}
		def guide = guideScreen.getText('UTF-8')
		def settings = settingsScreen.getText('UTF-8')
		if (!settings.contains('new FlightArmorGuideScreen(this)')) {
			throw new GradleException('Client settings no longer opens the built-in operation guide')
		}
		['PLATFORM(', 'SUMMON(', 'FLIGHT(', 'ESCORT(', 'WEAPONS(',
				'GuideTabButton', 'renderStepNode', 'drawPageGlyph',
				'Math.min(MAX_PANEL_WIDTH', 'Math.min(MAX_PANEL_HEIGHT', 'getWidth() < 64',
				'screen.flight_armor.guide.previous', 'screen.flight_armor.guide.next'].each { marker ->
			if (!guide.contains(marker)) {
				throw new GradleException("Operation guide lost page or visual marker: ${marker}")
			}
		}
		def smallGuiWidth = 320
		def smallGuiHeight = 240
		def smallPanelWidth = Math.min(448, Math.max(300, smallGuiWidth - 20))
		def smallPanelHeight = Math.min(244, Math.max(224, smallGuiHeight - 12))
		def smallTabWidth = ((smallPanelWidth - 20) - 3 * 4) / 5
		if (smallPanelWidth > smallGuiWidth || smallPanelHeight > smallGuiHeight
				|| smallTabWidth < 50) {
			throw new GradleException('Operation guide no longer fits the 320x240 small-window contract')
		}
		[guide, settings].each { uiSource ->
			if (!uiSource.contains('Component.translatable(')) {
				throw new GradleException('Operation/settings UI must use translated components')
			}
			if (uiSource.contains('Component.literal(')) {
				throw new GradleException('New operation/settings UI text bypasses language files')
			}
			['ClientPlayNetworking', 'ServerPlayNetworking', 'ArmorCoreActionPayload',
					'ServerPlayer', 'docs/OPERATION_GUIDE'].each { forbidden ->
				if (uiSource.contains(forbidden)) {
					throw new GradleException("Client guide must remain protocol-free and self-contained: ${forbidden}")
				}
			}
		}

		def parser = new groovy.json.JsonSlurper()
		def zh = parser.parse(zhFile)
		def en = parser.parse(enFile)
		def requiredKeys = [
				'screen.flight_armor.core.client_settings',
				'screen.flight_armor.core.client_settings.tooltip',
				'screen.flight_armor.client_settings.title',
				'screen.flight_armor.client_settings.reset',
				'screen.flight_armor.client_settings.guide',
				'screen.flight_armor.client_settings.done',
				'screen.flight_armor.client_settings.hud',
				'screen.flight_armor.client_settings.trail',
				'screen.flight_armor.client_settings.environment',
				'screen.flight_armor.client_settings.toggle',
				'screen.flight_armor.client_settings.on',
				'screen.flight_armor.client_settings.off',
				'screen.flight_armor.client_settings.local_only',
				'screen.flight_armor.client_settings.config_path',
				'screen.flight_armor.client_settings.master_volume',
				'screen.flight_armor.guide.title',
				'screen.flight_armor.guide.page_counter',
				'screen.flight_armor.guide.previous',
				'screen.flight_armor.guide.back',
				'screen.flight_armor.guide.next'
		]
		def pageIds = ['platform', 'summon', 'flight', 'escort', 'weapons']
		pageIds.each { page ->
			requiredKeys.add("screen.flight_armor.guide.tab.${page}")
			requiredKeys.add("screen.flight_armor.guide.page.${page}.title")
			requiredKeys.add("screen.flight_armor.guide.page.${page}.subtitle")
			(1..3).each { step ->
				requiredKeys.add("screen.flight_armor.guide.page.${page}.step.${step}.title")
				requiredKeys.add("screen.flight_armor.guide.page.${page}.step.${step}.body")
			}
			requiredKeys.add("screen.flight_armor.guide.page.${page}.tip")
		}
		requiredKeys.each { key ->
			if (!(zh[key] instanceof String) || zh[key].isBlank()) {
				throw new GradleException("Missing zh_cn operation-guide translation: ${key}")
			}
			if (!(en[key] instanceof String) || en[key].isBlank()) {
				throw new GradleException("Missing en_us operation-guide translation: ${key}")
			}
		}
	}
}

tasks.register('verifyTacticalFormationPreview') {
	group = 'verification'
	description = 'Guards the static armor-core tactical formation preview and its safe panel layout.'
	def screenFile = file('src/client/java/dev/codex/flightarmor/client/core/ArmorCoreCommandScreen.java')
	def rendererFile = file('src/client/java/dev/codex/flightarmor/client/core/TacticalFormationPreviewRenderer.java')
	def zhFile = file('src/main/resources/assets/flight_armor/lang/zh_cn.json')
	def enFile = file('src/main/resources/assets/flight_armor/lang/en_us.json')
	inputs.files(screenFile, rendererFile, zhFile, enFile)
	doLast {
		def screen = screenFile.getText('UTF-8')
		def renderer = rendererFile.getText('UTF-8')
		if (screen.contains('TacticalFormationPreviewRenderer.render(')) {
			throw new GradleException('The command center must not regress to the ambiguous miniature node preview')
		}
		['LIST_X = 10', 'LIST_Y = 60', 'LIST_W = 190', 'VISIBLE_ROWS = 7',
				'"控制权与战斗策略"', 'commandAutonomousButton', 'commandDirectedButton',
				'setSelected(commandSelectable && commanded)', '"编队方案"',
				'String primaryPlan', 'String escortPlan',
				'ArmorCoreAction.RECALL_ALL'].each { token ->
			if (!screen.contains(token)) {
				throw new GradleException("Unified command-center layout lost marker: ${token}")
			}
		}
		def settingsLabelKey = 'screen.flight_armor.core.client_settings'
		def settingsTooltipKey = 'screen.flight_armor.core.client_settings.tooltip'
		if (!screen.contains('new FlightArmorClientSettingsScreen(this)')
				|| !screen.contains("Component.translatable(\"${settingsLabelKey}\")")
				|| !screen.contains("Component.translatable(\"${settingsTooltipKey}\")")) {
			throw new GradleException('Client settings entry must retain translated label, tooltip and navigation')
		}
		def parser = new groovy.json.JsonSlurper()
		def translations = [zh_cn: parser.parse(zhFile), en_us: parser.parse(enFile)]
		translations.each { locale, values ->
			[settingsLabelKey, settingsTooltipKey].each { key ->
				if (!(values[key] instanceof String) || values[key].isBlank()) {
					throw new GradleException("Missing ${locale} armor-core settings translation: ${key}")
				}
			}
		}
		['enableScissor', 'disableScissor', 'MAX_ARMOR_NODES = 6', 'drawOwner',
				'drawPlatform', 'primarySuitId', 'selectedSuit', 'case READY, OFFLINE',
				'case ESCORTING, CRUISING', 'case INCOMPLETE, INVALID, CONFLICT'].each { token ->
			if (!renderer.contains(token)) {
				throw new GradleException("Tactical formation preview lost required state/layout marker: ${token}")
			}
		}
		['partialTick', 'gameTime', 'tickCount', 'Math.sin', 'Mth.sin', 'Math.cos',
				'Mth.cos', 'System.currentTimeMillis', 'Util.getMillis'].each { token ->
			if (renderer.contains(token)) {
				throw new GradleException("Tactical formation preview must remain static: ${token}")
			}
		}
	}
}
