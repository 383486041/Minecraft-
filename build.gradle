tasks.register('verifyItemPreviewResources') {
	group = 'verification'
	description = 'Checks variant OBJ item previews, dynamic renderer mappings and compact held transforms.'
	def modelDir = file('src/main/resources/assets/flight_armor/models/item')
	def objFiles = files(
			'src/main/resources/assets/flight_armor/models/armor/flight_armor_vanguard.obj',
			'src/main/resources/assets/flight_armor/models/armor/flight_armor_swift.obj',
			'src/main/resources/assets/flight_armor/models/armor/flight_armor_sentinel.obj')
	def previewSource = file('src/client/java/dev/codex/flightarmor/client/render/obj/FlightArmorItemPreviewRenderer.java')
	def clientInitializer = file('src/client/java/dev/codex/flightarmor/client/FlightArmorClient.java')
	def objResourceSource = file('src/client/java/dev/codex/flightarmor/client/render/obj/FlightArmorObjResources.java')
	def variantDataSource = file('src/main/java/dev/codex/flightarmor/variant/ArmorVariantData.java')
	inputs.files(objFiles)
	inputs.dir(modelDir)
	inputs.file(previewSource)
	inputs.files(clientInitializer, objResourceSource, variantDataSource)
	doLast {
		def parser = new groovy.json.JsonSlurper()
		def slots = ['flight_helmet', 'flight_chestplate', 'flight_leggings', 'flight_boots']
		def armorModels = []
		slots.each { slot ->
			def baseFile = new File(modelDir, "${slot}.json")
			def base = parser.parse(baseFile)
			armorModels.add(baseFile)
			if (base.parent != 'minecraft:builtin/entity') {
				throw new GradleException("Armor item must use the static OBJ renderer: ${baseFile}")
			}
			def overrides = base.overrides.collectEntries { entry ->
				[(entry.predicate['flight_armor:variant'].toString()): entry.model.toString()]
			}
			if (overrides['1.0'] != "flight_armor:item/${slot}_swift"
					|| overrides['2.0'] != "flight_armor:item/${slot}_sentinel") {
				throw new GradleException("Incomplete ArmorVariant model mapping: ${baseFile}")
			}
			['swift', 'sentinel'].each { variant ->
				def variantFile = new File(modelDir, "${slot}_${variant}.json")
				armorModels.add(variantFile)
				if (parser.parse(variantFile).parent != 'minecraft:builtin/entity') {
					throw new GradleException("Variant item still uses a generated 2D model: ${variantFile}")
				}
			}
		}
		armorModels.each { model ->
			if (model.getText('UTF-8').contains('minecraft:item/generated')) {
				throw new GradleException("Generated 2D armor icon is forbidden: ${model}")
			}
		}

		def coreModel = parser.parse(new File(modelDir, 'armor_navigation_core.json'))
		if (coreModel.parent != 'minecraft:builtin/entity') {
			throw new GradleException('Navigation core must use its dedicated 3D renderer')
		}
		def platformModel = parser.parse(new File(modelDir, 'charging_platform.json'))
		if (platformModel.parent != 'flight_armor:block/charging_platform_assembled'
				|| platformModel.gui_light != 'front') {
			throw new GradleException('Charging platform item must retain a clear dedicated 3D model')
		}
		def heldPlatformScale = platformModel.display.firstperson_righthand.scale.collect { it as double }.max()
		if (heldPlatformScale > 0.25D) {
			throw new GradleException("Charging platform first-person preview obscures the view: ${heldPlatformScale}")
		}

		def renderer = previewSource.getText('UTF-8')
		['FLIGHT_HELMET', 'FLIGHT_CHESTPLATE', 'FLIGHT_LEGGINGS', 'FLIGHT_BOOTS',
				'ARMOR_NAVIGATION_CORE'].each { item ->
			if (!renderer.contains("registry.register(ModItems.${item}, INSTANCE)")) {
				throw new GradleException("Missing dynamic item renderer registration for ${item}")
			}
		}
		if (!renderer.contains('ArmorVariantData.get(stack)')
				|| !renderer.contains('contextScale = 0.28F')) {
			throw new GradleException('Item preview must read stack ArmorVariant and stay compact in first person')
		}
		['tickCount', 'getGameTime', 'System.currentTimeMillis', 'Util.getMillis'].each { clock ->
			if (renderer.contains(clock)) {
				throw new GradleException("GUI preview must be static and clock-free: ${clock}")
			}
		}
		def coreStart = renderer.indexOf('private static void renderNavigationCore')
		def coreEnd = renderer.indexOf('private static void applyContextTransform', coreStart)
		if (coreStart < 0 || coreEnd <= coreStart) {
			throw new GradleException('Navigation-core preview renderer method is missing')
		}
		def coreRenderer = renderer.substring(coreStart, coreEnd)
		def baseDraw = coreRenderer.indexOf(
				'renderGroup(mesh, group, poseStack, base, packedLight')
		def emissiveAcquire = coreRenderer.indexOf(
				'VertexConsumer emissive = buffers.getBuffer')
		def emissiveDraw = coreRenderer.indexOf(
				'renderGroup(mesh, group, poseStack, emissive, LightTexture.FULL_BRIGHT')
		if (coreRenderer.contains('glowing ? emissive : base') || baseDraw < 0
				|| emissiveAcquire <= baseDraw || emissiveDraw <= emissiveAcquire) {
			throw new GradleException('Navigation-core preview must render base and emissive passes sequentially')
		}

		if (!clientInitializer.getText('UTF-8').contains('FlightArmorItemPreviewRenderer.initialize()')) {
			throw new GradleException('Dynamic item preview renderer is not initialized by the client entrypoint')
		}
		def objResources = objResourceSource.getText('UTF-8')
		['VANGUARD', 'SWIFT', 'SENTINEL'].each { variant ->
			if (!objResources.contains("ArmorVariant.${variant}")) {
				throw new GradleException("Missing OBJ resource mapping for ${variant}")
			}
		}
		if (!variantDataSource.getText('UTF-8').contains(
				'readExplicit(stack).orElse(ArmorVariant.DEFAULT)')) {
			throw new GradleException('Legacy armor stacks must safely fall back to Vanguard')
		}
		def hashes = objFiles.files.collect { file ->
			java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
		}.toSet()
		if (hashes.size() != 3) {
			throw new GradleException('Vanguard, Swift and Sentinel item previews must use distinct OBJ meshes')
		}
		def hasAny = { String name, List<String> fragments -> fragments.any { name.contains(it) } }
		def classify = { String raw ->
			def name = raw.toLowerCase(java.util.Locale.ROOT)
			if (hasAny(name, ['left_boot', 'boot_left', 'right_boot', 'boot_right', 'ankle'])) return 'FEET'
			if (hasAny(name, ['left_leg', 'leg_left', 'right_leg', 'leg_right'])) return 'LEGS'
			if (hasAny(name, ['left_arm', 'arm_left', 'right_arm', 'arm_right'])) return 'CHEST'
			if (hasAny(name, ['head', 'helmet', 'visor', 'faceplate', 'jaw', 'temple', 'brow'])) return 'HEAD'
			if (hasAny(name, ['body', 'chest', 'torso', 'core', 'collar', 'spine', 'back',
					'vane', 'wing'])) return 'CHEST'
			return null
		}
		def isLed = { String name -> name.endsWith('_led') || name.contains('_led_')
				|| name.startsWith('led_') || name.contains('emissive') || name.contains('_glow') }
		objFiles.files.each { obj ->
			def groups = obj.readLines('UTF-8').findAll { it.startsWith('g ') }
					.collect { it.substring(2).trim().toLowerCase(java.util.Locale.ROOT) }
			def unmatched = groups.findAll { classify(it) == null }
			if (!unmatched.isEmpty()) {
				throw new GradleException("Unmapped OBJ item groups in ${obj.name}: ${unmatched}")
			}
			def bySlot = groups.groupBy { classify(it) }
			['HEAD', 'CHEST', 'LEGS', 'FEET'].each { slot ->
				if (bySlot[slot] == null || bySlot[slot].isEmpty()) {
					throw new GradleException("${obj.name} has no ${slot} item geometry")
				}
				if (!bySlot[slot].any { isLed(it) }) {
					throw new GradleException("${obj.name} ${slot} preview has no full-bright emissive group")
				}
			}
			def standardCore = groups.contains('core_housing_titanium')
					&& groups.contains('core_reactor_led')
			def sentinelCore = groups.contains('core_housing_sentinel_titanium')
					&& groups.contains('core_reactor_sentinel_led')
			if (!standardCore && !sentinelCore) {
				throw new GradleException("${obj.name} cannot supply the navigation-core 3D preview")
			}
		}
	}
}
