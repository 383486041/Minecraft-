tasks.register('verifyHomingMissileEntityRegistration') {
	group = 'verification'
	description = 'Guards the persistent homing-missile registration against premature DFU lookup warnings.'
	def registrationFile = file('src/main/java/dev/codex/flightarmor/combat/ModCombatEntities.java')
	def entityFile = file('src/main/java/dev/codex/flightarmor/combat/ArmorHomingMissileEntity.java')
	inputs.files(registrationFile, entityFile)
	doLast {
		def registration = registrationFile.getText('UTF-8')
		def entity = entityFile.getText('UTF-8')
		if (!registration.contains('.build();')) {
			throw new GradleException('Homing missile must use Fabric injected EntityType.Builder.build() so DFU lookup is deferred until registry assignment.')
		}
		if (registration.contains('.build(FlightArmorMod.id(')) {
			throw new GradleException('Passing the missile id to EntityType.Builder.build(String) restores the No data fixer registered warning.')
		}
		if (registration =~ /\.(noSave|disableSaving)\s*\(/) {
			throw new GradleException('Homing missile persistence must not be disabled to silence the DFU warning.')
		}
		if (!registration.contains('.clientTrackingRange(12)') || !registration.contains('.updateInterval(1)')) {
			throw new GradleException('Homing missile native tracking range/update interval changed unexpectedly.')
		}
		if (!registration.contains('Registry.register(BuiltInRegistries.ENTITY_TYPE')) {
			throw new GradleException('Homing missile must retain native entity-type registry assignment for saving and spawn packets.')
		}
		if (!entity.contains('addAdditionalSaveData(CompoundTag tag)') || !entity.contains('readAdditionalSaveData(CompoundTag tag)')) {
			throw new GradleException('Homing missile NBT persistence hooks are missing.')
		}
	}
}
